<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

</head><body>
<title>Atelier Piano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Music&display=swap">
<style>
/* Layout: one-screen app. Home = scrolling column of cards; activity = header / stage / controls / keyboard pinned to the bottom like a real instrument. */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#14161C; --muted:#585D6E; --line:#D6D9E1;
  --felt:#A51D35; --felt-ink:#FFFFFF; --felt-soft:#F6DFE4;
  --brass:#8A6113; --brass-soft:#F3E8CF;
  --ok:#1C7A4B; --ok-soft:#D9F0E3; --bad:#BF3328; --bad-soft:#FADFDB; --meh:#A86A00;
  --fallboard:#191A20; --fallboard-ink:#F2F0EA; --fallboard-muted:#A9ABB5;
  --ivory:#FCFBF7; --ivory-edge:#CFCDC5; --ebony:#15161A; --ebony-top:#3B3D46;
  --staff:#2A2D37;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --f-music:"Noto Music","Apple Symbols","Segoe UI Symbol",serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1015; --surface:#181A21; --surface-2:#1F222B; --ink:#ECEDF2; --muted:#9DA1AF; --line:#2D303B;
  --felt:#E35A72; --felt-ink:#1A0A0E; --felt-soft:#3B1B24;
  --brass:#DDAE52; --brass-soft:#3A3020;
  --ok:#4CC78C; --ok-soft:#173528; --bad:#FF6D60; --bad-soft:#3E1C1A; --meh:#E9A93A;
  --fallboard:#08080B; --fallboard-ink:#F2F0EA; --fallboard-muted:#9EA0AA;
  --ivory:#E7E5DE; --ivory-edge:#A9A79F; --ebony:#0B0B0D; --ebony-top:#33353D;
  --staff:#C8CBD6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1015; --surface:#181A21; --surface-2:#1F222B; --ink:#ECEDF2; --muted:#9DA1AF; --line:#2D303B;
  --felt:#E35A72; --felt-ink:#1A0A0E; --felt-soft:#3B1B24;
  --brass:#DDAE52; --brass-soft:#3A3020;
  --ok:#4CC78C; --ok-soft:#173528; --bad:#FF6D60; --bad-soft:#3E1C1A; --meh:#E9A93A;
  --fallboard:#08080B; --fallboard-ink:#F2F0EA; --fallboard-muted:#9EA0AA;
  --ivory:#E7E5DE; --ivory-edge:#A9A79F; --ebony:#0B0B0D; --ebony-top:#33353D;
  --staff:#C8CBD6; color-scheme:dark;
}
html,body{height:100%}
/* An app, not a page: no double-tap zoom, no text selection or callout on long press. The keyboard keeps touch-action:none. */
*{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.mic-diag{display:block;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.big{min-height:56px;font-size:18px;padding:0 24px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:38px;padding:0 14px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- home ---------- */
.home{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{display:flex;height:30px;border-radius:5px;overflow:hidden;border:1.5px solid var(--ink)}
.brand-mark i{width:9px;background:var(--ivory);border-right:1.5px solid var(--ink);position:relative}
.brand-mark i:last-child{border-right:0}
.brand-mark i.b::after{content:"";position:absolute;right:-4px;top:0;width:6px;height:17px;background:var(--ink);z-index:1}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:40px;padding:0 14px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg)}

.fallboard{background:var(--fallboard);color:var(--fallboard-ink);border-radius:var(--r);overflow:hidden;position:relative}
.fallboard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--felt)}
.fb-in{padding:24px 24px 31px;display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
.fb-in > *{min-width:0}
.fallboard .eyebrow{color:var(--fallboard-muted)}
.fallboard h2{font-size:32px;font-weight:800;margin:6px 0 8px}
.fallboard p.lead{color:var(--fallboard-muted);max-width:44ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.steps .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--fallboard-muted);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{color:var(--fallboard-muted);font-size:14px;font-variant-numeric:tabular-nums}
.fb-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.fb-actions .note{color:var(--fallboard-muted);font-size:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.week{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--line);min-height:4px}
.week i.full{background:var(--felt)} .week i.part{background:var(--brass)}
.week small{font-size:11px;color:var(--muted)}

.section h2{font-size:22px;font-weight:800;margin-bottom:12px}
.section > p.sub{color:var(--muted);margin:-6px 0 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.unit{padding:18px}
.unit + .unit{margin-top:12px}
.unit-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.unit-head h3{font-size:19px;font-weight:700}
.unit-head .eyebrow{min-width:70px}
.unit-head p{color:var(--muted);font-size:14px;flex-basis:100%}
.unit-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:8px}
.unit-bar i{display:block;height:100%;background:var(--ok)}
.lesson{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 4px;min-height:56px}
.lesson:first-of-type{border-top:0}
.lesson .code{font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson .t{font-weight:700}
.lesson .k{display:block;font-size:13px;color:var(--muted);font-weight:400}
.lesson.locked{opacity:.45}
.lesson.next .code{color:var(--felt)}
.lesson.next .t::after{content:"À faire";margin-left:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--felt-soft);color:var(--felt);padding:2px 8px;border-radius:999px;vertical-align:2px}
.stars{display:inline-flex;gap:2px;font-size:18px;letter-spacing:0;line-height:1}
.stars i{font-style:normal;color:var(--line)} .stars i.on{color:var(--brass)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px;font-weight:700}
.card p{color:var(--muted);font-size:14px}
.card .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.lib{display:flex;flex-direction:column}
.lib button{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:14px 18px;min-height:60px}
.lib button:first-child{border-top:0}
.lib small{display:block;color:var(--muted)}

.article{padding:24px;display:flex;flex-direction:column;gap:18px}
.article h3{font-size:19px;font-weight:700;margin-bottom:4px}
.article p{max-width:68ch;color:var(--ink)}
.article .muted{color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pillars div{background:var(--surface-2);border-radius:12px;padding:14px}
.pillars b{font-family:var(--f-display);font-size:17px;display:block;margin-bottom:4px}
.pillars span{font-size:14px;color:var(--muted)}
.callout{background:var(--brass-soft);border-radius:12px;padding:16px}
.callout h3{color:var(--brass)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-child{border-top:0}
.set-row .lbl b{display:block} .set-row .lbl span{color:var(--muted);font-size:14px}
input[type=range]{accent-color:var(--felt);width:200px;max-width:100%}

[hidden]{display:none!important}
/* ---------- microphone ---------- */
.mic-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:700;white-space:nowrap}
.mic-btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mic-btn.err{color:var(--bad)}
.mic-lvw{display:block;width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mic-lv{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left;transform:scaleX(0);transition:transform .05s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.transfer textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px;box-sizing:border-box}
@media (max-width:700px){ .mic-btn .mic-t{display:none} }

/* ---------- repertoire & score ---------- */
.grid.rep{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.rep-card{padding:0;overflow:hidden;gap:6px}
.rep-card > :not(.preview){margin-inline:18px}
.rep-card .opts{margin-bottom:18px;margin-top:8px}
.preview{display:block;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 0 4px 6px;height:136px;overflow:hidden;text-align:left;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.preview svg{height:118px;width:auto;max-width:none}
.rep-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.rep-card h3{font-size:19px}
.score-head{display:flex;flex-direction:column;gap:6px}
.score-head h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.score-head .by{color:var(--muted);font-size:17px}
.score-head .tip-l{max-width:68ch;margin-top:4px}
.score-head .fb-actions{margin-top:10px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.system{position:relative;overflow-x:auto}
.system svg{display:block}
.bar-no{position:absolute;left:4px;top:18px;font-size:12px;color:var(--muted);font-style:italic}

/* ---------- activity ---------- */
.act{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;position:relative}
.act-top{display:flex;align-items:center;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.act-title{flex:1;min-width:0}
.act-title h1{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-prog{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.pbar{width:120px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--felt);transition:width .25s}
.act-stage{overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));position:relative}
.act-stage > *{max-width:100%}
.act-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.act-controls:empty{display:none}
.tip{max-width:62ch;text-align:center;color:var(--muted)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:4px}
.prompt-label{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prompt-big{font-family:var(--f-display);font-size:clamp(56px,11vh,96px);font-weight:800;line-height:1;color:var(--felt)}
.feedback{font-weight:700;min-height:1.5em;text-align:center;color:var(--muted)}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.status{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-height:1.5em;text-align:center}
.staff-scroll{width:100%;overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 0;-webkit-overflow-scrolling:touch}
.staff-scroll svg{display:block}
.staff-scroll.center svg{margin:0 auto}
.staff-single{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 24px;display:flex;justify-content:center}
.staff-single svg{height:min(30vh,260px);width:auto;max-width:100%}
.countin{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:120px;font-weight:800;color:var(--felt);opacity:.9}
.bigbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigbtns .btn{min-width:150px}
.dots{display:flex;gap:10px;justify-content:center;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.seg button[disabled]{opacity:.35;pointer-events:none}

/* staff svg */
.st-line{stroke:var(--staff);stroke-width:1.2}
.st-bar{stroke:var(--staff);stroke-width:1.4}
.st-bar.thick{stroke-width:4}
.st-clef{fill:var(--staff);font-family:var(--f-music)}
.st-ts{fill:var(--staff);font-family:var(--f-display);font-weight:800;font-size:25px}
.n .hd{fill:var(--staff);stroke:var(--staff);stroke-width:1.2}
.n .hd.hol{fill:var(--surface);stroke-width:2.2}
.n .stem,.n .ledger,.n .flag{stroke:var(--staff);stroke-width:1.6;fill:none}
.n .flag{stroke-width:2.2}
.st-beam{fill:var(--staff)}
.n .acc,.n .rest{fill:var(--staff);font-family:var(--f-music)}
.n .dot{fill:var(--staff)}
.n .fg{fill:var(--muted);font-family:var(--f-display);font-size:13px;font-weight:700;text-anchor:middle}
.n .nm{fill:var(--muted);font-size:13px;font-weight:700;text-anchor:middle}
.n.cur .hd,.n.cur .dot,.n.cur .beam,.n.cur .acc{fill:var(--felt);stroke:var(--felt)}
.n.cur .hd.hol{fill:var(--felt-soft)}
.n.cur .stem,.n.cur .ledger,.n.cur .flag{stroke:var(--felt)}
.n.cur .nm,.n.cur .fg{fill:var(--felt)}
.n.ok .hd,.n.ok .dot,.n.ok .beam,.n.ok .acc{fill:var(--ok);stroke:var(--ok)} .n.ok .hd.hol{fill:var(--ok-soft)}
.n.ok .stem,.n.ok .ledger,.n.ok .flag{stroke:var(--ok)}
.n.meh .hd,.n.meh .dot,.n.meh .beam{fill:var(--meh);stroke:var(--meh)} .n.meh .hd.hol{fill:var(--brass-soft)}
.n.meh .stem,.n.meh .ledger,.n.meh .flag{stroke:var(--meh)}
.n.miss .hd,.n.miss .dot,.n.miss .beam,.n.miss .acc{fill:var(--bad);stroke:var(--bad)} .n.miss .hd.hol{fill:var(--bad-soft)}
.n.miss .stem,.n.miss .ledger,.n.miss .flag{stroke:var(--bad)}
.ph{stroke:var(--felt);stroke-width:2.5;opacity:.75}

/* ---------- keyboard ---------- */
.kb-wrap{background:var(--fallboard);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:6px}
.felt{height:6px;background:var(--felt)}
.kb{position:relative;height:clamp(150px,30vh,250px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0 4px}
.kb.tall{height:clamp(190px,42vh,340px)}
.key{position:absolute;top:0;box-sizing:border-box}
.key.white{height:100%;background:linear-gradient(180deg,var(--ivory) 0%,var(--ivory) 88%,var(--ivory-edge) 100%);border:1px solid var(--ivory-edge);border-top:0;border-radius:0 0 7px 7px;z-index:1}
.key.black{height:61%;background:linear-gradient(180deg,var(--ebony-top) 0%,var(--ebony) 22%,var(--ebony) 92%,var(--ebony-top) 100%);border-radius:0 0 5px 5px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.35)}
.key .lbl{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:clamp(11px,1.6vw,15px);font-weight:700;color:#6F6E68;pointer-events:none}

<script>
"use strict";
/* ================= helpers ================= */
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==="style") el.style.cssText=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}
const NS="http://www.w3.org/2000/svg";
function sv(tag, attrs, text){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; return e; }
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let lastInteract=0; const markInteract=()=>{ lastInteract=Date.now(); };

/* ================= notes ================= */
const PC=[[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
const FR=["Do","Ré","Mi","Fa","Sol","La","Si"], EN=["C","D","E","F","G","A","B"];
const isBlack=m=>PC[m%12][1]===1;
const diatonic=m=>(Math.floor(m/12)-1)*7+PC[m%12][0];
function parseNote(s){
  const r=/^([A-G])(#|b)?(-?\d)$/.exec(s); if(!r) throw new Error("note "+s);
  return (+r[3]+1)*12+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1]]+(r[2]==="#"?1:r[2]==="b"?-1:0);
}
function pcName(pc){
  const [st,sh]=PC[((pc%12)+12)%12]; const s=sh?"♯":""; const n=P.settings.names;
  if(n==="en") return EN[st]+s; if(n==="both") return FR[st]+s+" · "+EN[st]+s; return FR[st]+s;
}
function keyName(m){ const [st,sh]=PC[m%12]; return (P.settings.names==="en"?EN[st]:FR[st])+(sh?"♯":""); }
function whites(a,b){ const out=[]; for(let m=parseNote(a); m<=parseNote(b); m++) if(!isBlack(m)) out.push(m); return out; }
function rangeFor(midis,minWhites=12){
  let lo=Math.min(...midis), hi=Math.max(...midis);
  while(lo%12!==0&&lo%12!==5) lo--;
  while(hi%12!==4&&hi%12!==11) hi++;
  const count=()=>{ let c=0; for(let m=lo;m<=hi;m++) if(!isBlack(m)) c++; return c; };
  let side=0;
  while(count()<minWhites){ if(side++%2===0){ hi++; while(isBlack(hi)) hi++; } else { lo--; while(isBlack(lo)) lo--; } }
  return [lo,hi];
}

/* ================= progress store ================= */
const DEFAULT=()=>({v:1,updatedAt:0,lessons:{},notes:{},days:{},sessions:0,settings:{names:"fr",labels:"auto",volume:.8,metro:true}});
function merge(x){ const d=DEFAULT(); return Object.assign(d,x||{},{settings:Object.assign(d.settings,(x&&x.settings)||{})}); }
let P=DEFAULT();
const LKEY="atelier-piano-v1";
const Store={
  ref:null, synced:false, busy:false, again:false, t:0,
  saveLocal(){ try{ localStorage.setItem(LKEY,JSON.stringify(P)); }catch(e){} },
  loadLocal(){ try{ const s=localStorage.getItem(LKEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  async init(){
    const l=this.loadLocal(); if(l){ P=merge(l); migrate(); }
    try{
      if(!window.claude||!window.claude.use) return;
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.ref=db.doc("data/users/"+id+"/progress");
      const snap=await this.ref.get();
      const r=snap.exists?snap.data():null;
      if(r&&(r.updatedAt||0)>(P.updatedAt||0)){ P=merge(JSON.parse(JSON.stringify(r))); migrate(); this.saveLocal(); if(onHome) renderHome(); }
      else if(P.updatedAt&&(!r||P.updatedAt>(r.updatedAt||0))) this.push();
      this.synced=true; if(onHome&&tab==="settings") renderHome();
    }catch(e){ /* stays local */ }
  },
  save(){ P.updatedAt=Date.now(); this.saveLocal(); clearTimeout(this.t); this.t=setTimeout(()=>this.push(),1500); },
  async push(){
    if(!this.ref) return; if(this.busy){ this.again=true; return; }
    this.busy=true;
    try{ await this.ref.set(JSON.parse(JSON.stringify(P))); }catch(e){}
    this.busy=false; if(this.again){ this.again=false; this.push(); }
  }
};
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function today(){ const k=dayKey(); if(!P.days[k]) P.days[k]={s:0,a:0}; return P.days[k]; }
const dayActive=k=>{ const x=P.days[k]; return !!x&&(x.a>0||x.s>=300); };
function streak(){ let n=0; const d=new Date(); if(!dayActive(dayKey(d))) d.setDate(d.getDate()-1); while(dayActive(dayKey(d))){ n++; d.setDate(d.getDate()-1); } return n; }

/* ================= audio ================= */
const Audio={
  ctx:null, live:new Map(), sched:[],
  ensure(){
    if(!this.ctx){
      // Pick the iOS audio session before the context exists: switching it later can leave the context interrupted.
      try{ const as=navigator.audioSession; if(as&&as.type!=="play-and-record") as.type=P.settings.mic?"play-and-record":"playback"; }catch(e){}
      const C=window.AudioContext||window.webkitAudioContext;
      const ctx=this.ctx=new C({latencyHint:"interactive"});
      ctx.onstatechange=()=>{ if(ctx.state!=="running"&&ctx.state!=="closed"&&!document.hidden) ctx.resume().catch(()=>{}); Mic.notify(); };
      this.out=ctx.createGain(); this.out.gain.value=P.settings.volume;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.003; comp.release.value=.2;
      this.out.connect(comp); comp.connect(ctx.destination);
      this.bus=ctx.createGain(); this.bus.connect(this.out);
      const conv=ctx.createConvolver(); conv.buffer=this.impulse(1.7); const wet=ctx.createGain(); wet.gain.value=.2;
      this.bus.connect(conv); conv.connect(wet); wet.connect(this.out);
      const im=new Float32Array([0,1,.42,.2,.12,.07,.045,.025,.014,.008]);
      this.wave=ctx.createPeriodicWave(new Float32Array(im.length),im);
      const nb=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.06),ctx.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.noise=nb;
    }

    return this.ctx;
  },
  impulse(sec){ const ctx=this.ctx, len=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8); } return b; },
  setVolume(v){ if(this.out) this.out.gain.value=v; },
  liveT:new Map(), clicks:[],
  appSounding(m){
    if(!this.ctx) return false; const now=this.ctx.currentTime;
    for(const v of this.sched){ if(v.m==null||(v.m-m)%12!==0) continue; if(v.t<=now+.03&&now<(v.rel!=null?v.rel:v.end)+.35) return true; }
    for(const [lm,t] of this.liveT){ if((lm-m)%12===0&&(this.live.has(lm)||now-t<.35)) return true; }
    return false;
  },
  clickNear(t){ return this.clicks.some(c=>Math.abs(c-t)<.07); },
  voice(m,vel,t){
    const ctx=this.ctx, f=440*Math.pow(2,(m-69)/12);
    const g=ctx.createGain(), flt=ctx.createBiquadFilter(), mix=ctx.createGain();
    flt.type="lowpass"; flt.Q.value=.5; mix.gain.value=.5;
    const o1=ctx.createOscillator(), o2=ctx.createOscillator();
    o1.setPeriodicWave(this.wave); o2.setPeriodicWave(this.wave);
    o1.frequency.value=f; o2.frequency.value=f; o1.detune.value=-2; o2.detune.value=3.5;
    o1.connect(mix); o2.connect(mix); mix.connect(flt); flt.connect(g); g.connect(this.bus);
    const peak=vel*.36, decay=clamp(2.6-(m-36)*.045,.35,2.8);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+.006);
    g.gain.setTargetAtTime(peak*.45,t+.006,.09); g.gain.setTargetAtTime(0,t+.25,decay);
    flt.frequency.setValueAtTime(Math.min(f*9+900,12000)*(.6+vel*.4),t);
    flt.frequency.setTargetAtTime(Math.min(f*3+400,8000),t+.01,.35);
    const end=t+decay*6+.3; o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
    const n=ctx.createBufferSource(); n.buffer=this.noise; const nf=ctx.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=Math.min(f*4,6000); nf.Q.value=1.1;
    const ng=ctx.createGain(); ng.gain.setValueAtTime(vel*.07,t); ng.gain.exponentialRampToValueAtTime(.0005,t+.045);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t); n.stop(t+.06);

  },
  release(v,t){
    t=Math.max(t,v.t+.03);
    try{ v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0,t,.07); v.o.forEach(o=>o.stop(t+.6)); }catch(e){}
  },
  noteOn(m,vel=.8){ const ctx=this.ensure(); this.noteOff(m); const v=this.voice(m,vel,ctx.currentTime); this.live.set(m,v); this.liveT.set(m,ctx.currentTime); },
  noteOff(m){ const v=this.live.get(m); if(!v) return; this.live.delete(m); this.liveT.set(m,this.ctx.currentTime); this.release(v,this.ctx.currentTime); },
  play(m,when,dur,vel=.72){ const ctx=this.ensure(); const v=this.voice(m,vel,Math.max(when,ctx.currentTime)); v.rel=when+dur; this.release(v,when+dur); this.sched.push(v); this.prune(); return v; },
  click(when,accent){
    const ctx=this.ensure(); const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="square"; o.frequency.value=accent?1750:1150;
    g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(accent?.16:.1,when+.002); g.gain.exponentialRampToValueAtTime(.0008,when+.045);
    o.connect(g); g.connect(this.out); o.start(when); o.stop(when+.06);
    this.clicks.push(when); if(this.clicks.length>48) this.clicks.shift();
    this.sched.push({g,o:[o],t:when,end:when+.06});
  },
  prune(){ const now=this.ctx.currentTime; if(this.sched.length>400) this.sched=this.sched.filter(v=>v.end>now); },
  stopAll(){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    for(const v of this.sched){ if(v.end<now) continue;
      try{ if(v.t>now){ v.g.disconnect(); v.o.forEach(o=>o.stop(now)); } else { v.g.gain.cancelScheduledValues(now); v.g.gain.setTargetAtTime(0,now,.03); v.o.forEach(o=>o.stop(now+.2)); } }catch(e){} }
    this.sched=[];
  }

/* ================= microphone: hearing a real piano ================= */
// YIN pitch estimate on one frame. Returns {f, c} (frequency, clarity 0..1) or null.
function yin(buf,sr){
  const half=buf.length>>1, d=new Float32Array(half);
  const minTau=Math.floor(sr/2200), maxTau=Math.min(half-2,Math.ceil(sr/58));
  for(let tau=1;tau<=maxTau;tau++){ let s=0; for(let i=0;i<half;i++){ const x=buf[i]-buf[i+tau]; s+=x*x; } d[tau]=s; }
  let run=0; d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; d[tau]=run?d[tau]*tau/run:1; }
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){ if(d[t]<.18){ while(t+1<maxTau&&d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<2) return null;
  const a=d[tau-1], b=d[tau], c=d[tau+1], den=2*(2*b-c-a);
  const bt=den?tau+(c-a)/den:tau;
  return {f:sr/bt,c:1-b};
}
const Mic={
  on:false, err:null, kb:null, onOnset:null, heard:null, level:0,
  hist:[], lastOnset:0, armed:false, current:null, cand:null, candN:0,
  supported(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); },
  sens(){ return P.settings.micSens!=null?P.settings.micSens:.6; },
  async start(){
    if(this.on) return true;
    if(!this.supported()){ this.err="unsupported"; this.notify(); return false; }
    try{
      // iOS: a context born in a "playback" session hears nothing from the mic. Rebuild it in "play-and-record".
      const as=navigator.audioSession;
      if(as&&Audio.ctx&&as.type!=="play-and-record"){ Audio.stopAll(); try{ Audio.ctx.onstatechange=null; Audio.ctx.close(); }catch(e){} Audio.ctx=null; Audio.live.clear(); Audio.liveT.clear(); }
      try{ if(as) as.type="play-and-record"; }catch(e){}
      const ctx=Audio.ensure();
      const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      this.stream=s; if(ctx.state!=="running") await ctx.resume().catch(()=>{});
      const src=this.src=ctx.createMediaStreamSource(s);
      this.an=ctx.createAnalyser(); this.an.fftSize=2048;
      this.an2=ctx.createAnalyser(); this.an2.fftSize=8192; this.an2.smoothingTimeConstant=0;
      // Safari only feeds analysers that lead to the destination: route them there through a muted gain.
      const mute=this.mute=ctx.createGain(); mute.gain.value=0; mute.connect(ctx.destination);
      src.connect(this.an); src.connect(this.an2); this.an.connect(mute); this.an2.connect(mute);
      // iOS cuts the microphone when the app goes to the background: start again on return.
      s.getAudioTracks().forEach(t=>{ t.onended=()=>{ if(this.stream!==s) return; this.stop(); this.resume=true; }; });
      this.buf=new Float32Array(2048); this.spec=new Float32Array(4096);
      this.on=true; this.err=null; this.timer=setInterval(()=>this.tick(),25); this.notify(); return true;
    }catch(e){ this.err=(e&&e.name)||"error"; this.notify(); return false; }
  },
  stop(){ clearInterval(this.timer); const s=this.stream; this.stream=null; if(s) s.getTracks().forEach(t=>t.stop());
    try{ this.src&&this.src.disconnect(); this.mute&&this.mute.disconnect(); }catch(e){} this.src=this.mute=null; this.on=false; this.heard=null; this.level=0;
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){} this.notify(); },
  tick(){
    const ctx=Audio.ctx, buf=this.buf; this.an.getFloatTimeDomainData(buf);
    let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    const rms=Math.sqrt(s/buf.length), now=ctx.currentTime, gate=.002+.03*Math.pow(1-this.sens(),2);

        if(this.candN>=2&&now-this.lastOnset>.04&&!octaveSlip&&(this.armed||m!==this.current)){ this.current=m; const t=this.armed?this.lastOnset:now-.06; this.armed=false; this.emit(m,t); } } }

  },
  // Spectral peaks (Hz) of the current frame, refreshed at most once per tick.
  peaks(){
    const now=Audio.ctx.currentTime; if(this.pk&&now-this.pkT<.02) return this.pk;
    this.an2.getFloatFrequencyData(this.spec); const sp=this.spec, bin=Audio.ctx.sampleRate/8192;
    let mx=-300; for(let k=8;k<1500;k++) if(sp[k]>mx) mx=sp[k];

    for(let k=12;k<1500;k++){ const b=sp[k]; if(b<thr||b<sp[k-1]||b<=sp[k+1]) continue;

  },
  // Is note m sounding right now? Fundamental, or 2nd and 3rd harmonics when the fundamental is weak (bass).

  },
  // Shortly after an attack: confirm chords (and missed single notes) against what the lesson expects.
  chordCheck(){
    const kb=this.kb; if(!kb||!kb.expect) return;
    const exp=[...new Set(kb.expect())].filter(x=>kb.keys.has(x)&&!Audio.appSounding(x)); if(!exp.length) return;
    if(exp.length===1&&this.emittedSinceOnset) return;
    const present=exp.filter(x=>this.has(x));
    if(present.length!==exp.length) return;
    const before=kb.expect().join();
    for(const x of present){ if(kb.expect().join()!==before) break; if(x===this.lastEmit&&this.emittedSinceOnset) continue; this.heard=x; kb.virtual(x,{t:this.lastOnset,mic:true}); }
    this.notify();
  },
  emit(m,t){
    if(m===this.lastEmit&&t-this.lastEmitT<.15) return; this.lastEmit=m; this.lastEmitT=t; this.emittedSinceOnset=true;
    const kb=this.kb; if(!kb||Audio.appSounding(m)) return;
    let mm=m; const exp=kb.expect?kb.expect():null;
    if(exp&&exp.length>1&&!exp.includes(m)) return; // single-pitch tracking is unreliable on chords: chordCheck decides
    if(exp&&exp.length&&!exp.includes(m)){ const alt=exp.find(x=>Math.abs(x-m)===12||Math.abs(x-m)===24); if(alt!=null&&this.has(alt)) mm=alt; }
    this.heard=mm; this.notify();
    if(kb.keys.has(mm)) kb.virtual(mm,{t,mic:true});

function Keyboard(wrap,{lo,hi,labels=false,tall=false}){

  function up(m){ const c=(counts.get(m)||1)-1; counts.set(m,c); if(c>0) return; keys.get(m)&&keys.get(m).classList.remove("down"); Audio.noteOff(m); api.onUp&&api.onUp(m); }

  api.unmark=(m,c)=>keys.get(m)&&keys.get(m).classList.remove(c);
  api.clear=(...cs)=>keys.forEach(k=>k.classList.remove(...cs));

  api.finger=(m,n)=>{ const k=keys.get(m); if(k) k.querySelector(".fing").textContent=n||""; };
  api.clearFingers=()=>keys.forEach(k=>k.querySelector(".fing").textContent="");

function renderStaff(p,opt={}){

  if(T) lines(G.tTop); if(B) lines(G.bTop);
  if(R) add(svg,"line",{class:"st-line",x1:8,x2:W-8,y1:G.r,y2:G.r});
  if(T&&B) add(svg,"line",{class:"st-bar",x1:8,x2:8,y1:G.tTop,y2:G.bBot});
  if(T) add(svg,"text",{class:"st-clef",x:14,y:G.tBot-12,"font-size":48},"\u{1D11E}");
  if(B) add(svg,"text",{class:"st-clef",x:14,y:G.bTop+12,"font-size":48},"\u{1D122}");
  if(!opt.single&&!opt.noTs){
    const tx=R?44:80; const ts=(t0)=>{ add(svg,"text",{class:"st-ts",x:tx,y:t0+21,"text-anchor":"middle"},p.ts[0]); add(svg,"text",{class:"st-ts",x:tx,y:t0+45,"text-anchor":"middle"},p.ts[1]); };

function parseVoice(str,staff){
  const notes=[]; let t=0;
  for(const tok of str.trim().split(/\s+/)){
    if(tok==="|") continue;
    const [p,d="q"]=tok.split(":"); let dur=DUR[d[0]]; if(d.endsWith(".")) dur*=1.5;

function getPiece(id){
  if(pieceCache[id]) return pieceCache[id];
  const d=PIECES[id], notes=[]; let total=0;
  if(d.rh){ const v=parseVoice(d.rh,"T"); notes.push(...v.notes); total=Math.max(total,v.length); }
  if(d.lh){ const v=parseVoice(d.lh,"B"); notes.push(...v.notes); total=Math.max(total,v.length); }
  const em=new Map();
  for(const n of notes){ if(n.rest) continue; if(!em.has(n.t)) em.set(n.t,{t:n.t,notes:[]}); em.get(n.t).notes.push(n); }
  return pieceCache[id]={...d,id,notes,total,staves:(d.rh?"T":"")+(d.lh?"B":""),ts:d.ts||[4,4],pickup:d.pickup||0,events:[...em.values()].sort((a,b)=>a.t-b.t)};
}

function sliceBars(pc,i,j){ const B=barBounds(pc), s=B[i], e=B[Math.min(j,B.length-1)];

function buildSession(){
  const done=id=>!!(P.lessons[id]&&P.lessons[id].done), steps=[];
  let pool=null, clef="T";
  if(done("l5a")){ pool=[...whites("C3","G3"),...whites("C4","C5")]; clef="TB"; }
  else if(done("l4a")) pool=whites("C4","C5");
  else if(done("l3a")){ pool=[...whites("C3","G3"),...whites("C4","G4")]; clef="TB"; }
  else if(done("l2b")) pool=whites("C4","G4");
  else if(done("l2a")) pool=whites("C4","E4");
  if(pool) steps.push({label:"Échauffement : lecture de notes",min:3,spec:{kind:"read",title:"Échauffement : lecture",pool,clef,rounds:12}});
  else steps.push({label:"Échauffement : repérer les notes",min:2,spec:{kind:"find",title:"Échauffement : le clavier",pool:[0,2,4,5,7,9,11],rounds:10}});
  const dn=new Date().getDate();
  if(done("l3d")&&dn%2===0) steps.push({label:"Oreille : rejoue la mélodie",min:3,spec:{kind:"echo",title:"Oreille : rejoue la mélodie",pool:whites("C4","G4"),rounds:5}});
  else if(done("l3d")) steps.push({label:"Oreille : retrouve la note",min:2,spec:{kind:"earfind",title:"Oreille : retrouve la note",pool:done("l5e")?whites("C4","C5"):whites("C4","G4"),rounds:6}});
  else steps.push({label:"Oreille : aigu ou grave",min:2,spec:{kind:"earhl",title:"Oreille : aigu ou grave ?",rounds:8}});
  if(done("l2e")){ const lv=[0]; if(done("l3b")) lv.push(1); if(done("l4d")) lv.push(2); const k=lv[dn%lv.length];
    steps.push({label:"Déchiffrage : une mélodie jamais vue",min:2,spec:{kind:"sight",level:k,title:"Déchiffrage · "+SIGHT[k].label}}); }
  const nl=nextLesson();
  if(nl) steps.push({label:`Nouvelle leçon ${nl.code} : ${nl.title}`,min:6,spec:specOf(nl)});
  const rev=ALL.filter(l=>l.type==="piece"&&done(l.id)&&l!==nl).sort((a,b)=>((lst(a).due||0)-(lst(b).due||0))||((lst(a).tempo||0)-(lst(b).tempo||0))||((lst(a).last||0)-(lst(b).last||0)));
  if(rev.length) steps.push({label:`Révision en mesure : ${rev[0].title}`,min:4,spec:{...specOf(rev[0]),mode:"tempo"}});
  return steps;
}

function recordResult(spec,res){
  if(spec.lessonId){
    const L=P.lessons[spec.lessonId]||(P.lessons[spec.lessonId]={});
    L.stars=Math.max(L.stars||0,res.stars); if(res.stars>=1) L.done=true; L.last=Date.now();
    if(res.mode) L[res.mode]=Math.max(L[res.mode]||0,res.stars);
    if(res.bpm) L.bpm=Math.max(L.bpm||0,res.bpm);
    // spaced review: a piece played well comes back later and later, a shaky one comes back tomorrow
    if(spec.kind==="piece"){ L.iv=res.stars>=3?Math.min(30,Math.max(2,(L.iv||1)*2)):res.stars===2?2:1; L.due=Date.now()+L.iv*864e5; }

/* ================= activities ================= */
const KINDS={};

KINDS.find=(spec,fr,finish)=>{
  const kb=Keyboard(fr.kbWrap,{lo:48,hi:72,labels:false});
  const prompt=h("div",{class:"prompt"}), fb=h("div",{class:"feedback"});
  if(spec.tip) fr.stage.append(h("p",{class:"tip"},spec.tip));
  fr.stage.append(prompt,fb);
  const single=spec.pool.length===1, found=new Set();
  let round=0, first=0, misses=0, target=null, last=null;
  const N=single?[...kb.keys.keys()].filter(m=>m%12===spec.pool[0]).length:spec.rounds;
  kb.expect=()=>target==null?[]:[...kb.keys.keys()].filter(k=>k%12===target&&!found.has(k));
  function next(){
    kb.clear("hint"); fb.textContent=""; fb.className="feedback";
    if(round>=N){ const s=first/N; return finish({score:s,stars:starsFor(s),detail:`${first} sur ${N} trouvées du premier coup.`}); }
    let pc; do{ pc=pick(spec.pool); }while(spec.pool.length>1&&pc===last); last=target=pc; misses=0;
    prompt.replaceChildren(h("span",{class:"prompt-label"},single&&round>0?"Trouve un autre":"Trouve"),h("span",{class:"prompt-big"},pcName(pc)));
    fr.setProgress(round,N);
  }
  kb.onDown=m=>{
    if(target==null) return;
    if(m%12===target&&!(single&&found.has(m))){ kb.flash(m,"ok",500); if(single) found.add(m); if(misses===0) first++; round++; fb.textContent="Oui !"; fb.className="feedback ok"; const t=target; target=null; setTimeout(()=>{ target=t; next(); },380); }
    else if(single&&found.has(m)){ fb.textContent="Celui-là est déjà trouvé. Cherche plus haut ou plus bas."; fb.className="feedback"; }
    else { misses++; kb.flash(m,"bad"); fb.textContent=`Ça, c'est ${pcName(m%12)}.`; fb.className="feedback bad";
      if(misses>=2) kb.keys.forEach((k,km)=>{ if(km%12===target&&!found.has(km)) kb.mark(km,"hint"); }); }
  };
  next();
  return {destroy(){ kb.destroy(); }};
};

KINDS.read=(spec,fr,finish)=>{
  const [lo,hi]=rangeFor(spec.pool,12);
  const kb=Keyboard(fr.kbWrap,{lo,hi,labels:labelsOn(spec)});
  const box=h("div",{class:"staff-single"}), fb=h("div",{class:"feedback"});
  if(spec.tip) fr.stage.append(h("p",{class:"tip"},spec.tip));
  fr.stage.append(box,fb);
  const staffOf=m=>spec.clef==="TB"?(m>=60?"T":"B"):spec.clef;
  const key=m=>staffOf(m)+m;
  let i=0, first=0, target=null, wrong=false, shown=0, last=null;
  kb.expect=()=>target==null?[]:[target];
  function choose(){ const ws=spec.pool.map(m=>{ const r=P.notes[key(m)]; const b=r?r.b:1; return m===last?.001:Math.pow(2,4-b); });
    let x=Math.random()*ws.reduce((a,b)=>a+b,0); for(let k=0;k<ws.length;k++){ x-=ws[k]; if(x<=0) return spec.pool[k]; } return spec.pool[0]; }
  function next(){
    kb.clear("hint");
    if(i>=spec.rounds){ Store.save(); const s=first/spec.rounds; return finish({score:s,stars:starsFor(s),detail:`${first} notes sur ${spec.rounds} lues du premier coup.`,advice:"Les notes ratées reviendront plus souvent dans les prochains exercices."}); }
    target=choose(); last=target; wrong=false; shown=performance.now();
    const L=renderStaff({notes:[{m:target,t:0,dur:4,staff:staffOf(target)}],staves:spec.clef,ts:[4,4],total:4},{single:true});
    box.replaceChildren(L.svg); fb.textContent="Quelle est cette note ? Joue-la."; fb.className="feedback"; fr.setProgress(i,spec.rounds);
  }
  kb.onDown=m=>{
    if(target==null) return;
    const r=P.notes[key(target)]||(P.notes[key(target)]={b:1,n:0,ok:0});
    if(m===target){
      if(!wrong){ first++; r.ok++; r.n++; if(performance.now()-shown<4000) r.b=Math.min(4,r.b+1); }
      kb.flash(m,"ok",500); kb.clear("hint"); fb.textContent=`${pcName(target%12)} ✓`; fb.className="feedback ok"; i++; const w=wrong; target=null; setTimeout(next,w?650:420);
    } else {
      if(!wrong){ r.b=0; r.n++; }
      wrong=true; kb.flash(m,"bad"); kb.mark(target,"hint");
      fb.textContent=m%12===target%12?`Bon nom, mauvaise octave. Joue la touche indiquée.`:`C'était ${pcName(target%12)}. Joue la touche indiquée.`; fb.className="feedback bad";
    }
  };
  next();
  return {destroy(){ kb.destroy(); }};
};

KINDS.piece=(spec,fr,finish)=>{
  const pc=getPiece(spec.piece), two=pc.staves==="TB", ui=spec.ui||{};
  const rec=(spec.lessonId&&P.lessons[spec.lessonId])||{};
  const slow=Math.max(40,Math.round(pc.bpm*.75/4)*4);
  let mode=spec.mode||"wait", hands=ui.hands||"both", help=ui.help!=null?ui.help:spec.help!==false, names=ui.names!=null?ui.names:(!!pc.names&&!two), metro=P.settings.metro;
  let bpm=ui.bpm||(rec.bpm?Math.min(pc.bpm,rec.bpm+4):(rec.tempo>=2?pc.bpm:slow));
  const BB=barBounds(pc), nb=BB.length-1;
  let sel=null, selOpen=false, loop=true, V=pc, S=0, E=pc.total, tok=0, dead=false, perfect=0;
  const keep=()=>{ spec.ui={hands,bpm,help,names}; };
  const all=pc.notes.filter(n=>!n.rest).map(n=>n.m);
  const [lo,hi]=rangeFor(all,14);
  const kb=Keyboard(fr.kbWrap,{lo,hi,labels:labelsOn(spec)});
  const scroller=h("div",{class:"staff-scroll"}), status=h("div",{class:"status"}), count=h("div",{class:"countin",hidden:true});
  if(pc.tip) fr.stage.append(h("p",{class:"tip"},pc.tip));
  fr.stage.append(scroller,status,count);
  let L=null, marks=new Map(), cur=null, raf=0, run=null;
  const isReq=n=>hands==="both"||(hands==="R"?n.staff==="T":n.staff==="B");
  const req=ev=>ev.notes.filter(isReq);
  let evs=[];
  const refreshEvs=()=>{ evs=pc.events.filter(e=>e.t>=S-1e-6&&e.t<E-1e-6&&req(e).length); };
  const selLabel=()=>sel?(sel[1]-sel[0]===1?`mesure ${sel[0]+1}`:`mesures ${sel[0]+1} à ${sel[1]}`):"";
  // Practise a passage: bars sel[0]..sel[1]-1. Everything below works in absolute beats, S..E being the part on screen.
  function setSel(s){ sel=s; V=sel?sliceBars(pc,sel[0],sel[1]):pc; S=V.start||0; E=V.total; perfect=0; draw(); begin(); }
  // First run of bars (4 at most) holding a missed or late note, or null when nothing or everything is weak.
  function weakBars(){
    const bad=[]; for(let i=0;i<nb;i++){ if(evs.some(e=>e.t>=BB[i]-1e-6&&e.t<BB[i+1]-1e-6&&(marks.get(e.t)==="miss"||marks.get(e.t)==="meh"))) bad.push(i); }
    if(!bad.length||bad.length===nb||nb<3) return null;
    let a=bad[0], b=a; while(bad.includes(b+1)&&b-a<3) b++;
    return [a,b+1];
  }
  function weakExtra(){ const w=weakBars(); if(!w) return null;
    return {label:w[1]-w[0]===1?`Travailler la mesure ${w[0]+1}`:`Travailler les mesures ${w[0]+1} à ${w[1]}`,fn:()=>{ selOpen=true; setSel(w); }}; }
  const zoom=()=>clamp(Math.min(window.innerWidth/900,window.innerHeight/700),.85,1.4)*(two?.9:1.15);
  function draw(){ L=renderStaff(V,{names,zoom:zoom(),cont:!!sel&&sel[1]<nb}); scroller.replaceChildren(L.svg); paint(); }
  function paint(){ if(!L) return; L.svg.querySelectorAll("g.n").forEach(g=>{ const t=+g.dataset.t; g.setAttribute("class","n"+(marks.has(t)?" "+marks.get(t):"")+(cur===t?" cur":"")); }); }
  function scrollTo(x,smooth){ const left=x*(L.svg.getBoundingClientRect().width/L.W)-scroller.clientWidth*.32; if(smooth&&scroller.scrollTo) scroller.scrollTo({left,behavior:"smooth"}); else scroller.scrollLeft=left; }
  function stop(){ tok++; cancelAnimationFrame(raf); raf=0; run=null; Audio.stopAll(); kb.clear("demo","hint"); kb.clearFingers(); count.hidden=true; if(L) L.ph.setAttribute("x1",-20),L.ph.setAttribute("x2",-20); }
  function setPh(beat){ const x=L.xAt(beat); L.ph.setAttribute("x1",x); L.ph.setAttribute("x2",x); scrollTo(x,false); }
  const spb=()=>60/bpm;

  /* --- step by step --- */
  let W=null;
  function waitStart(){ stop(); refreshEvs(); marks=new Map(); W={i:0,pressed:new Set(),err:false,errors:0,clean:0}; setCur(); if(!evs.length) status.textContent="Rien à jouer pour cette main dans ce passage."; }
  function setCur(){
    kb.clear("hint"); kb.clearFingers();
    const ev=evs[W.i]; cur=ev?ev.t:null; paint(); if(!ev) return;
    if(help) req(ev).forEach(n=>{ if(!W.pressed.has(n.m)){ kb.mark(n.m,"hint"); if(n.finger) kb.finger(n.m,n.finger); } });
    scrollTo(L.xs.get(ev.t),true);
    status.textContent=`Pas à pas · note ${W.i+1} sur ${evs.length}`+(sel?` · ${selLabel()}`:"");
  }
  function waitDown(m,meta){
    const ev=evs[W.i]; if(!ev) return;
    const need=req(ev).map(n=>n.m);
    if(need.includes(m)){
      if(W.pressed.size===0){ const now=Audio.ctx.currentTime; ev.notes.filter(n=>!req(ev).includes(n)).forEach(n=>Audio.play(n.m,now,n.dur*spb()*.95,.55)); }
      W.pressed.add(m); kb.unmark(m,"hint");
      if(meta&&meta.mic) need.forEach(x=>{ if(!W.pressed.has(x)&&Mic.has(x)){ W.pressed.add(x); kb.unmark(x,"hint"); } });
      if(need.every(x=>W.pressed.has(x))){
        marks.set(ev.t,W.err?"miss":"ok"); if(!W.err) W.clean++;
        W.i++; W.pressed=new Set(); W.err=false;
        if(W.i>=evs.length){ cur=null; kb.clear("hint"); kb.clearFingers(); paint(); const s=W.clean/evs.length, k=tok;
          if(sel){ perfect=s===1?perfect+1:0;
            status.textContent=`${W.clean} sur ${evs.length} du premier coup. `+(perfect>=3?"Trois fois sans faute : passage acquis. Élargis-le ou passe « En mesure ».":s===1?"Sans faute ! Encore une fois pour l'ancrer…":"On reprend le passage…");
            setTimeout(()=>{ if(k===tok&&!dead&&mode==="wait") waitStart(); },perfect>=3?2800:1500); }
          else { const extra=weakExtra(), w=W; keep();
            setTimeout(()=>{ if(k!==tok||dead) return; finish({mode:"wait",score:s,stars:starsFor(s),extra,detail:`${w.clean} notes justes du premier coup sur ${evs.length}, ${w.errors} fausse${w.errors>1?"s":""} note${w.errors>1?"s":""}.`,
              advice:s>=.7?"Prochaine étape : le mode « En mesure », à tempo lent.":extra?"Isole les mesures qui accrochent et répète-les : c'est là que se font les progrès.":"Refais-le pas à pas : la précision d'abord, la vitesse ensuite."}); },450); }
        }
        else setCur();
      }
    } else {
      W.err=true; W.errors++; kb.flash(m,"bad");
      if(!help) need.forEach(x=>{ if(!W.pressed.has(x)) kb.mark(x,"hint"); });
    }
  }

  /* --- in time --- */
  const WIN=.3;
  const at=t=>run.t0+(t-S)*run.s;
  function tempoStart(){
    stop(); refreshEvs(); marks=new Map(); cur=null; paint();
    const ctx=Audio.ensure(), s=spb(), bpb=pc.ts[0], lat=ctx.outputLatency||ctx.baseLatency||0;
    const lead=(pc.pickup&&S===0)?(bpb-pc.pickup):0;
    const t0=ctx.currentTime+.3+(bpb+lead)*s;
    for(let i=0;i<bpb+lead;i++) Audio.click(t0-(bpb+lead-i)*s,i%bpb===0);
    if(metro) for(let b=0;b<Math.ceil(E-S);b++) Audio.click(t0+b*s,((S+b-pc.pickup)%bpb+bpb)%bpb===0);
    V.notes.forEach(n=>{ if(!n.rest&&!isReq(n)) Audio.play(n.m,t0+(n.t-S)*s,n.dur*s*.95,.55); });
    run={kind:"tempo",t0,s,lat,judged:evs.map(()=>new Map()),errors:0,hint:""};
    status.textContent=`En mesure · ${bpm} à la noire · écoute le décompte`;
    loopTempo();
  }
  function evalMark(i){ const need=req(evs[i]); const j=run.judged[i]; if(j.size<need.length) return; const avg=[...j.values()].reduce((a,b)=>a+b,0)/need.length;
    marks.set(evs[i].t,avg>=.7?"ok":avg>0?"meh":"miss"); paint(); }
  function loopTempo(){
    if(!run||run.kind!=="tempo") return;
    const now=Audio.ctx.currentTime-run.lat, beat=S+(now-run.t0)/run.s;
    setPh(beat);
    if(beat<S){ count.hidden=false; count.textContent=Math.max(1,Math.ceil(S-beat)); } else count.hidden=true;
    evs.forEach((ev,i)=>{ if(now>at(ev.t)+WIN){ const j=run.judged[i]; let ch=false; req(ev).forEach(n=>{ if(!j.has(n.m)){ j.set(n.m,0); ch=true; } }); if(ch) evalMark(i); } });
    const nxt=evs.find(ev=>ev.t>beat-.15);
    const hk=help&&nxt&&nxt.t-beat<1.2?nxt.t+"":"";
    if(hk!==run.hint){ run.hint=hk; kb.clear("hint"); kb.clearFingers(); if(hk) req(nxt).forEach(n=>{ kb.mark(n.m,"hint"); if(n.finger) kb.finger(n.m,n.finger); }); }
    const c=nxt?nxt.t:null; if(c!==cur){ cur=c; paint(); }
    if(beat>E+.6) return tempoEnd();
    raf=requestAnimationFrame(loopTempo);
  }
  function tempoDown(m,meta){
    if(!run) return; const now=(meta&&meta.t!=null?meta.t:Audio.ctx.currentTime)-run.lat;
    let best=-1, bd=1e9;
    evs.forEach((ev,i)=>{ if(!req(ev).some(n=>n.m===m)||run.judged[i].has(m)) return; const d=Math.abs(now-at(ev.t)); if(d<WIN&&d<bd){ bd=d; best=i; } });
    if(best>=0){ const pts=bd<.09?1:bd<.18?.75:.4; run.judged[best].set(m,pts); evalMark(best);
      const early=now<at(evs[best].t); status.textContent=pts===1?"Pile à temps":pts>=.75?"Bien":early?"Un peu en avance":"Un peu en retard"; }
    else if(now>run.t0-WIN){ run.errors++; kb.flash(m,"bad"); status.textContent="Fausse note"; }
  }
  function tempoEnd(){
    const r=run; stop(); cur=null; paint();
    const total=evs.reduce((a,ev)=>a+req(ev).length,0);
    const pts=r.judged.reduce((a,j)=>a+[...j.values()].reduce((x,y)=>x+y,0),0);
    const s=total?clamp(pts/total-r.errors*.02,0,1):0, played=bpm;
    if(sel){
      let msg=`Passage : ${Math.round(s*100)} % à ♩ = ${played}.`;
      if(s>=.9&&bpm<pc.bpm){ bpm=Math.min(pc.bpm,bpm+4); msg+=` On monte à ${bpm}.`; }
      else if(s>=.9) msg+=" C'est au tempo : passage acquis.";
      else if(s<.5&&bpm>40){ bpm=Math.max(40,bpm-4); msg+=` On ralentit à ${bpm}.`; }
      if(loop){ tempoStart(); status.textContent=msg+" On reprend après le décompte."; } else status.textContent=msg;
      buildControls(); return;
    }
    const partial=two&&hands!=="both"; let stars=starsFor(s); const capped=stars===3&&(partial||played<pc.bpm); if(capped) stars=2;
    if(s>=.85&&bpm<pc.bpm) bpm=Math.min(pc.bpm,bpm+4); else if(s<.5) bpm=Math.max(40,bpm-4);
    const extra=weakExtra(); keep();
    const advice=capped&&partial?"Chaque main seule, c'est acquis. La troisième étoile se gagne les deux mains ensemble."
      :capped?`Très propre. Prochain palier : ♩ = ${bpm}. La troisième étoile se gagne au tempo du morceau, ♩ = ${pc.bpm}.`
      :s>=.85&&played<pc.bpm?`Prochain palier : ♩ = ${bpm}.`
      :s<.5?`On ralentit : prochain essai à ♩ = ${bpm}. Lent et juste vaut mieux que vite et faux.`
      :s<.7&&extra?"Isole les mesures qui accrochent, répète-les en boucle, puis reviens au morceau entier.":null;
    finish({mode:"tempo",score:s,stars,bpm:s>=.7&&!partial?played:0,extra,detail:`Précision rythmique : ${Math.round(s*100)} % à ${played} à la noire.`,advice});
  }

  /* --- listen --- */
  function listenStart(){
    stop(); marks=new Map(); paint();
    const ctx=Audio.ensure(), s=spb(), t0=ctx.currentTime+.35;
    V.notes.forEach(n=>{ if(!n.rest) Audio.play(n.m,t0+(n.t-S)*s,n.dur*s*.95); });
    run={kind:"listen",t0,s,lit:""};
    status.textContent="Écoute et regarde les touches s'allumer";
    const loop=()=>{ if(!run||run.kind!=="listen") return; const beat=S+(Audio.ctx.currentTime-run.t0)/run.s; setPh(beat);
      const on=V.notes.filter(n=>!n.rest&&n.t<=beat&&beat<n.t+n.dur*.92); const key=on.map(n=>n.m).join(",");
      if(key!==run.lit){ run.lit=key; kb.clear("demo"); kb.clearFingers(); on.forEach(n=>{ kb.mark(n.m,"demo"); }); }
      const c=on.length?on[0].t:null; if(c!==cur){ cur=c; paint(); }
      if(beat>E+.4){ stop(); cur=null; paint(); status.textContent="Fin. À toi de jouer : choisis « Pas à pas »."; buildControls(); return; }
      raf=requestAnimationFrame(loop); };
    loop();
  }

  kb.expect=()=>{
    if(mode==="wait"&&W&&evs[W.i]) return req(evs[W.i]).map(n=>n.m);
    if(run&&run.kind==="tempo"){ const now=Audio.ctx.currentTime-run.lat; return evs.filter(ev=>Math.abs(at(ev.t)-now)<.45).flatMap(ev=>req(ev).map(n=>n.m)); }
    return [];
  };

  /* --- controls --- */
  function seg(opts,val,on){ return h("div",{class:"seg"},opts.map(([v,l])=>h("button",{class:v===val?"on":"","aria-pressed":v===val?"true":"false",onclick:()=>on(v)},l))); }
  function chip(label,val,on){ return h("button",{class:"chip"+(val?" on":""),"aria-pressed":val?"true":"false",onclick:()=>on(!val)},label); }
  function begin(){ if(mode==="wait") waitStart(); else { stop(); refreshEvs(); W=null; marks=new Map(); cur=null; paint(); status.textContent=mode==="tempo"?"Appuie sur Démarrer : un décompte d'une mesure, puis à toi.":"Appuie sur Écouter."; } buildControls(); }
  function buildControls(){

          const s=P.settings; P=merge(o); migrate(); P.settings=Object.assign(P.settings,{mic:s.mic,micSens:s.micSens}); Store.save(); toast("Progression importée."); renderHome(); }
        catch(e){ toast("Ce code n'est pas valide. Recopie-le en entier."); } }},"Importer ce code")));
}

/* ================= practice time ================= */
setInterval(()=>{ if(onHome||document.hidden||Date.now()-lastInteract>45000) return; today().s+=5; Store.saveLocal(); },5000);
setInterval(()=>{ if(!onHome&&!document.hidden&&Date.now()-lastInteract<60000) Store.save(); },30000);
document.addEventListener("pointerdown",()=>{ markInteract(); if(Audio.ctx&&Audio.ctx.state!=="running") Audio.ctx.resume().then(()=>Mic.notify(),()=>{}); },true);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ Store.save(); return; }
  if(Audio.ctx&&Audio.ctx.state!=="running") Audio.ctx.resume().catch(()=>{});
  if(Mic.resume&&P.settings.mic&&!Mic.on){ Mic.resume=false; Mic.start(); } });
/* No zoom: iOS ignores user-scalable, so block pinch and double-tap here (not on the keyboard, the pad or form fields). */
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{ const now=Date.now(), quick=now-lastTouchEnd<350; lastTouchEnd=now;
  if(quick&&e.cancelable&&!(e.target.closest&&e.target.closest("button,input,textarea,select,.kb,.pad"))) e.preventDefault(); },{passive:false});

renderHome();
Store.init();
</script>
</body></html>
